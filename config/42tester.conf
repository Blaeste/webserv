server {
	listen 8080;
	server_name localhost;
	client_max_body_size 100;

	# ====== ERROR PAGES (optionnel mais propre) ======
	error_page 400 /error_pages/400.html;
	error_page 403 /error_pages/403.html;
	error_page 404 /error_pages/404.html;
	error_page 405 /error_pages/405.html;
	error_page 413 /error_pages/413.html;
	error_page 500 /error_pages/500.html;

	# ====== ROOT / → GET ONLY ======
	location / {
		root ./www;
		index index.html index.htm;
		allowed_methods GET;
		autoindex off;
	}

	# ====== CGI .bla → POST ONLY ======
	location /cgi-bla {
		root .;
		allowed_methods POST;
		cgi_extension .bla;
		cgi_path ./cgi_test;
	}

	# ====== /post_body → POST ONLY ======
	location /post_body {
		root ./www;
		allowed_methods POST;
	}

	# ====== /directory/ → GET, root YoupiBanane, index custom ======
	location /directory/ {
		root ./YoupiBanane;
		allowed_methods GET;
		index youpi.bad_extension;
		autoindex off;
	}
}
